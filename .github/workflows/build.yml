name: Build CLI

on:
  pull_request:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_PROFILE: release
  CARGO_BIN_NAME: decomp-dev-cli
  CARGO_TARGET_DIR: target
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
            build: zigbuild
          - platform: ubuntu-latest
            target: i686-unknown-linux-musl
            name: linux-i686
            build: zigbuild
          - platform: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: linux-aarch64
            build: zigbuild
          - platform: windows-latest
            target: i686-pc-windows-msvc
            name: windows-x86
            build: build
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            build: build
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            build: build
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            build: build
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            build: build
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cargo-zigbuild
        if: matrix.build == 'zigbuild'
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          pip install ziglang==0.13.0 cargo-zigbuild==0.23.4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Cargo build
        run: >-
          cargo ${{ matrix.build }} --locked --profile ${{ env.BUILD_PROFILE }}
          --target ${{ matrix.target }} --package decomp-dev-cli
          --bin ${{ env.CARGO_BIN_NAME }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CARGO_BIN_NAME }}-${{ matrix.name }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/${{ env.BUILD_PROFILE }}/${{ env.CARGO_BIN_NAME }}
            ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/${{ env.BUILD_PROFILE }}/${{ env.CARGO_BIN_NAME }}.exe
          if-no-files-found: error
